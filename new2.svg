<svg xmlns="http://www.w3.org/2000/svg" width="140" height="20" role="img" aria-label="CI: Nouvelle">
  <title>CI: Nouvelle</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#fff" stop-opacity=".7"></stop>
    <stop offset=".1" stop-color="#aaa" stop-opacity=".1"></stop>
    <stop offset=".9" stop-color="#000" stop-opacity=".3"></stop>
    <stop offset="1" stop-color="#000" stop-opacity=".5"></stop>
  </linearGradient>
  <clipPath id="r">
    <rect width="140" height="20" rx="3" fill="#fff"></rect>
  </clipPath>

  <!-- Partie gauche -->
  <g clip-path="url(#r)">
    <rect width="60" height="20" fill="#555"></rect>
    <rect x="60" width="80" height="20" fill="#6f42c1"></rect>
    <rect width="140" height="20" fill="url(#s)"></rect>
  </g>

  <!-- Texte gauche -->
  <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11">
    <text x="30" y="14">CI</text>
    <text x="100" y="14">Nouvelle</text>
  </g>
</svg>